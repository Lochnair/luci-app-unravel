<?xml version="1.0" standalone="no"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">

<!-- One direction of an unRAVEL instance, styled like LuCI's realtime
     graphs (svg/bandwidth.svg) so themes restyle both the same way. -->
<svg width="100%" height="100%" version="1.1" xmlns="http://www.w3.org/2000/svg">
	<polyline id="rate" points="" style="fill:blue;fill-opacity:0.15;stroke:blue;stroke-width:1" />
	<polyline id="traffic" points="" style="fill:green;fill-opacity:0.4;stroke:green;stroke-width:1" />

	<line x1="0" y1="25%" x2="100%" y2="25%" style="stroke:black;stroke-width:0.1" />
	<text id="label_75" x="20" y="24%" style="fill:#eee; font-size:9pt; font-family:sans-serif; text-shadow:1px 1px 1px #000"> </text>

	<line x1="0" y1="50%" x2="100%" y2="50%" style="stroke:black;stroke-width:0.1" />
	<text id="label_50" x="20" y="49%" style="fill:#eee; font-size:9pt; font-family:sans-serif; text-shadow:1px 1px 1px #000"> </text>

	<line x1="0" y1="75%" x2="100%" y2="75%" style="stroke:black;stroke-width:0.1" />
	<text id="label_25" x="20" y="74%" style="fill:#eee; font-size:9pt; font-family:sans-serif; text-shadow:1px 1px 1px #000"> </text>

	<!-- Minute markers, added by the view. -->
	<g id="times" />

	<!-- The base rate; the view moves it to its height. -->
	<line id="base" x1="0" y1="-10" x2="100%" y2="-10" style="stroke:black;stroke-width:1;stroke-dasharray:6 4" />
	<text id="base_label" x="100%" y="-10" dx="-8" text-anchor="end" style="fill:#eee; font-size:9pt; font-family:sans-serif; text-shadow:1px 1px 1px #000">base</text>
</svg>
